
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K&B Workforce | Employee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">

<main class="max-w-lg mx-auto min-h-screen bg-white shadow-sm">
  <header class="bg-slate-950 text-white px-6 pt-10 pb-8 rounded-b-3xl">
    <div class="flex justify-between items-center">
      <div>
        <div class="text-xs tracking-widest text-indigo-300 font-bold">K&B NET SERVICE</div>
        <h1 class="text-2xl font-extrabold mt-2">Field Workforce</h1>
        <p class="text-slate-400 text-sm mt-1">Employee workspace</p>
      </div>
      <div class="bg-indigo-500/20 text-indigo-200 rounded-2xl p-3 text-2xl">◈</div>
    </div>
  </header>

  <section id="login" class="p-6 space-y-4">
    <h2 class="font-bold text-xl">Welcome back</h2>
    <p class="text-slate-500 text-sm">Sign in with your assigned Firebase account.</p>

    <label class="block text-sm font-semibold">
      Email
      <input id="email" type="email" autocomplete="username"
        class="mt-2 w-full border rounded-xl p-3 outline-indigo-500"
        placeholder="employee@company.com">
    </label>

    <label class="block text-sm font-semibold">
      Password
      <input id="password" type="password" autocomplete="current-password"
        class="mt-2 w-full border rounded-xl p-3 outline-indigo-500">
    </label>

    <button id="signIn" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl p-3 w-full font-bold">
      Sign in securely
    </button>
    <p id="loginError" role="alert" class="text-sm text-rose-600"></p>
  </section>

  <section id="workspace" class="hidden p-6 space-y-5">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-slate-500 text-sm">Signed in as</p>
        <h2 id="userName" class="font-bold text-lg"></h2>
      </div>
      <button id="signOut" class="text-indigo-600 text-sm font-semibold">Sign out</button>
    </div>

    <div class="rounded-2xl border p-5 bg-indigo-50">
      <p class="text-indigo-700 text-sm font-semibold">Shift status</p>
      <h3 id="shiftStatus" class="text-2xl font-extrabold mt-1">Loading…</h3>
      <p class="text-slate-500 text-xs mt-2">
        Shift actions are recorded in Firebase. GPS tracking is not enabled in this version.
      </p>
      <div class="flex gap-3 mt-4">
        <button id="startShift" class="flex-1 bg-indigo-600 text-white rounded-xl p-3 font-semibold">Start shift</button>
        <button id="endShift" class="flex-1 border border-indigo-200 bg-white text-indigo-700 rounded-xl p-3 font-semibold">End shift</button>
      </div>
    </div>

    <div class="rounded-2xl border p-5">
      <h3 class="font-bold">My assigned tasks</h3>
      <div id="tasks" class="mt-3 text-sm text-slate-500">Loading…</div>
      <p id="taskFeedback" role="status" class="text-sm text-indigo-700 mt-3"></p>
    </div>

    <p id="actionError" role="alert" class="text-sm text-rose-600"></p>
  </section>
</main>

<script type="module" src="./employee.js"></script>
</body>
</html>
